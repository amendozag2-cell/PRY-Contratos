server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Contratos de hasta 10 MB y documentos del corpus de hasta 20 MB
    client_max_body_size 25m;

    # API: /api/contratos -> http://backend:8000/contratos
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El análisis con IA puede tardar
        proxy_read_timeout 180s;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de React (/contratos/5, /admin/corpus...) se resuelven en el navegador
    location / {
        try_files $uri $uri/ /index.html;
    }
}